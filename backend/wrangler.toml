name = "aketch-booking"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://aketch.ie,https://www.aketch.ie"
BOOKING_TO = "hello@aketch.ie"
# Set BOOKING_FROM to an address on your verified Resend sending domain.

[[ratelimits]]
name = "BOOKING_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
